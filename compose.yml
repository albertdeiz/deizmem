name: deizmem

x-app: &app
  build: .
  image: deizmem-app:local
  restart: unless-stopped
  environment: &app-env
    DM_DATABASE_URL: postgres://deizmem:${DM_DB_PASSWORD:-deizmem}@postgres:5432/deizmem
    DM_DOCUMENT_URL: ${DM_DOCUMENT_URL-http://documents:8000}
    DM_VISION_URL: ${DM_VISION_URL-http://ocr:8000}
    DM_AUDIO_URL: ${DM_AUDIO_URL-http://whisper:8000}
    DM_EMBED_URL: ${DM_EMBED_URL-http://embed:8000}
  volumes:
    - ./data/blobs:/data/blobs
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: deizmem
      POSTGRES_PASSWORD: ${DM_DB_PASSWORD:-deizmem}
      POSTGRES_DB: deizmem
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deizmem -d deizmem"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations and creates the first owner, then exits.
  migrate:
    build: .
    image: deizmem-app:local
    command: ["init"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["worker"]

  # The agent's interface. Published on the Pi's loopback only; containers on
  # the `deizmem` network (Hermes, later) reach it as http://mcp:4319/mcp.
  mcp:
    <<: *app
    command: ["mcp"]
    environment:
      <<: *app-env
      DM_MCP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4319:4319"
    networks:
      default: {}
      # Shared with Hermes and nothing else (daHouseLab ADR-0017). Created once:
      #   docker network create --internal deizmem_mcp
      deizmem_mcp:
        aliases: [deizmem-mcp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4319/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  documents:
    build: services/documents
    image: deizmem-documents:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Multilingual embeddings on ONNX. The model is a variable: change EMBED_MODEL
  # and the worker rebuilds the vectors on its own (CLAUDE.md §7).
  embed:
    build: services/embed
    image: deizmem-embed:local
    restart: unless-stopped
    # Same uid as the host user that owns ./data, like the app containers.
    user: "${DM_UID:-1000}:${DM_GID:-1000}"
    environment:
      HOME: /tmp
      HF_HOME: /models/hf
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBED_THREADS: ${EMBED_THREADS:-2}
    volumes:
      - ./data/models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # Printed images and scanned PDFs. Handwriting is the agent's job.
  ocr:
    build: services/ocr
    image: deizmem-ocr:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Voice notes. Language detected, never configured.
  whisper:
    build: services/whisper
    image: deizmem-whisper:local
    restart: unless-stopped
    user: "${DM_UID:-1000}:${DM_GID:-1000}"
    environment:
      HOME: /tmp
      HF_HOME: /models/hf
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_CACHE: /models/whisper
    volumes:
      - ./data/models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

networks:
  deizmem_mcp:
    external: true
